<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>조이랜드 통독</title>
  <!-- 앱처럼 설치 (PWA) -->
  <link rel="manifest" href="/manifest-home.json">
  <meta name="theme-color" content="#7B4FE8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="조이랜드 통독">
  <link rel="apple-touch-icon" href="/icons/icon-home-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-home-192.png">
  <script>window.JOYLAND_APP='home';</script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root { --p:#7B4FE8; --pl:#F0EBFF; --pd:#5B2ED6; --gold:#FFB800; --amber:#FF8C42; --green:#2DC38C; --text:#1E1248; --sub:#8B87A0; --bdr:#EEE8FF; --bg:#F8F6FF; }
    body { font-family: 'Apple SD Gothic Neo','Noto Sans KR',sans-serif; background: #EDE8FF; color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
    .page { max-width: 430px; width: 100%; background: #FFFFFF; min-height: 100vh; box-shadow: 0 0 60px rgba(107,63,216,0.15); }

    .header { padding: 52px 20px 20px; }
    .header-gr { font-size: 13px; color: var(--sub); margin-bottom: 5px; }
    .header-nm { font-size: 24px; font-weight: 900; color: var(--text); }
    .header-nm span { font-size: 15px; font-weight: 400; color: var(--sub); }

    .tue-banner {
      background: white;
      margin: 0 14px 12px; padding: 16px 18px;
      border-radius: 18px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 18px rgba(100,80,180,0.09);
      border: 1px solid var(--bdr);
    }
    .tue-banner .bt { font-size: 14px; font-weight: 800; color: var(--text); }
    .tue-banner .bs { font-size: 12px; color: var(--sub); margin-top: 3px; }
    .check-btn { background: var(--p); color: white; padding: 9px 18px; border-radius: 99px; font-size: 13px; font-weight: 700; border: none; cursor: pointer; }

    .child-card {
      background: white; border-radius: 18px;
      margin: 0 14px 12px; padding: 16px 18px;
      box-shadow: 0 2px 18px rgba(100,80,180,0.09);
      border: 1px solid var(--bdr);
    }
    .child-row { display: flex; align-items: center; margin-bottom: 16px; }
    .child-name { font-size: 17px; font-weight: 800; }
    .child-grade { font-size: 12px; color: var(--sub); margin-top: 2px; }
    .child-deadline { font-size: 12px; color: #EF4444; font-weight: 700; margin-top: 2px; }
    .pr-lbl { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 7px; }
    .pr-cnt { font-weight: 800; color: var(--p); }
    .pr-bg { background: var(--pl); border-radius: 99px; height: 9px; overflow: hidden; }
    .pr-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--p), #B088FF); transition: width 0.6s ease; }

    .lock-notice {
      margin: 0 14px 12px; background: white; border-radius: 18px;
      padding: 14px 18px;
      box-shadow: 0 2px 18px rgba(100,80,180,0.09);
      border: 1px solid var(--bdr);
    }
    .lock-notice .lt { font-size: 13px; font-weight: 700; color: var(--text); }
    .lock-notice .ls { font-size: 11px; color: var(--sub); margin-top: 3px; }

    .sec { padding: 20px 16px; }
    .sec-t { font-size: 15px; font-weight: 800; margin-bottom: 14px; }
    .sec-hint { font-size: 11px; color: var(--p); font-weight: 700; background: var(--pl); padding: 8px 12px; border-radius: 10px; margin-bottom: 12px; }

    .stamp-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .stamp {
      aspect-ratio: 1; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .stamp-wk { font-size: 12px; font-weight: 800; line-height: 1.15; }
    .stamp-dt { font-size: 9.5px; font-weight: 600; opacity: .72; line-height: 1.2; margin-top: 1px; }
    .stamp.done { background: linear-gradient(135deg, #7B4FE8, #B088FF); color: white; box-shadow: 0 4px 14px rgba(123,79,232,0.3); }
    .stamp.partial { background: linear-gradient(135deg, #FFB800, #FF8C42); color: white; box-shadow: 0 4px 12px rgba(255,184,0,0.28); }
    .stamp.open { background: white; color: var(--p); border: 3px solid var(--p); cursor: pointer; animation: pulse 1.6s ease-in-out infinite; }
    .stamp.open:active { transform: scale(0.9); }
    .stamp.locked { background: #EDEBF8; color: #A89ED4; border: 2px solid #D5CFF4; }
    .stamp.missed { background: #F5F3FF; color: #C4BBE8; }
    .stamp.future { background: #EDEBF8; color: #B0A8D4; }
    /* 방학·개강·종강 주간 — 체크 대상 아님 */
    .stamp.special {
      background: repeating-linear-gradient(45deg, #F7F5FF, #F7F5FF 5px, #EFEBFC 5px, #EFEBFC 10px);
      color: #9C93C4; border: 1.5px dashed #CFC7EE; cursor: default;
    }
    .stamp-tag { font-size: 8.5px; font-weight: 800; margin-top: 1px; letter-spacing: -.02em; line-height: 1.1; }
    /* 테스트 주차 — 체크는 가능하지만 시상에는 미반영 */
    .stamp.test { position: relative; }
    .stamp.test.future,
    .stamp.test.missed { background: #FFF6E6; color: #C08A2E; border: 1.5px dashed #F0C97A; }
    .stamp.test.locked { background: #FFF1D9; color: #B5801F; border: 2px solid #EFC271; }
    .stamp.test.open   { background: white; color: #E09A25; border: 3px solid #F0B446; }
    .stamp.test .stamp-tag { color: #D08C1E; }
    .stamp.test.done .stamp-tag,
    .stamp.test.partial .stamp-tag { color: rgba(255,255,255,.9); }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(123,79,232,0.3)} 50%{box-shadow:0 0 0 8px rgba(123,79,232,0)} }

    .hist-item { display: flex; align-items: center; padding: 13px 0; border-bottom: 1px solid #F0EBFF; gap: 12px; }
    .hist-item:last-child { border-bottom: none; }
    .hist-inf { flex: 1; }
    .hist-wk { font-size: 13px; font-weight: 700; }
    .hist-dt { font-size: 11px; color: var(--sub); margin-top: 2px; }
    .hist-st { font-size: 12px; font-weight: 800; }
    .hist-st.done { color: var(--green); }
    .hist-st.partial { color: var(--amber); }
    .hist-st.missed { color: #D1D5DB; }

    .logout-btn { display: block; text-align: center; padding: 16px; font-size: 13px; color: var(--sub); cursor: pointer; border: none; background: none; width: 100%; }

    .loading-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; z-index: 999; }
    .loading-screen.hidden { display: none; }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--pl); border-top-color: var(--p); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .overlay { position: fixed; inset: 0; background: rgba(10,0,40,0.55); display: none; align-items: flex-end; justify-content: center; z-index: 999; backdrop-filter: blur(3px); }
    .overlay.show { display: flex; }
    .sheet { background: white; border-radius: 28px 28px 0 0; padding: 8px 24px 40px; width: 100%; max-width: 430px; }
    .sheet-handle { width: 40px; height: 4px; background: #DDD; border-radius: 99px; margin: 14px auto 22px; }
    .sheet-t { font-size: 19px; font-weight: 900; text-align: center; margin-bottom: 4px; }
    .sheet-sub { font-size: 13px; color: var(--sub); text-align: center; margin-bottom: 24px; }
    .check-opt { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 18px; border: 2.5px solid var(--bdr); margin-bottom: 10px; cursor: pointer; transition: transform 0.12s; }
    .check-opt:active { transform: scale(0.97); }
    .check-opt.complete { border-color: var(--p); background: var(--pl); }
    .check-opt.partial-opt { border-color: var(--gold); background: #FFFAEB; }
    .check-opt-ic { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .check-opt-ic.ic-done { background: var(--p); }
    .check-opt-ic.ic-done::after { content: '✓'; color: white; font-size: 20px; font-weight: 900; }
    .check-opt-ic.ic-partial { background: var(--gold); }
    .check-opt-ic.ic-partial::after { content: '½'; color: white; font-size: 16px; font-weight: 900; }
    .check-opt-lbl { font-size: 15px; font-weight: 700; }
    .check-opt-desc { font-size: 11px; color: var(--sub); margin-top: 2px; }

    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #1E1248; color: white; padding: 12px 24px; border-radius: 99px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
    .toast.show { opacity: 1; }

    /* 통독/출석 탭 */
    .home-tabs { display: flex; background: #F5F5FA; margin: 0 14px 14px; border-radius: 12px; padding: 3px; }
    .h-tab { flex: 1; padding: 9px; border-radius: 11px; border: none; background: none; color: var(--sub); font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .h-tab.active { background: white; color: var(--text); box-shadow: 0 1px 8px rgba(0,0,0,0.09); }

    /* 출석 섹션 */
    .att-card { background: white; border-radius: 18px; margin: 0 14px 12px; padding: 16px 18px; box-shadow: 0 2px 18px rgba(100,80,180,0.09); border: 1px solid var(--bdr); }
    .att-badge { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; flex-shrink: 0; }
    .att-ok     { background: #E9FAF4; color: var(--green); }
    .att-late   { background: #FFF2E8; color: var(--orange); }
    .att-absent { background: #FEE2E2; color: var(--red); }
    .att-none   { background: var(--bdr); color: var(--sub); }
    .att-row { display: flex; align-items: center; padding: 11px 0; border-bottom: 1px solid #F0EBFF; gap: 12px; }
    .att-row:last-child { border-bottom: none; }
    .att-row-inf { flex: 1; }
    .att-wk { font-size: 13px; font-weight: 700; color: var(--text); }
    .att-dt { font-size: 11px; color: var(--sub); margin-top: 2px; }
  </style>
</head>
<body>


<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <div style="font-size:14px;color:#8B87A0;">불러오는 중...</div>
</div>

<div class="page" id="mainPage" style="display:none">
  <div class="header" id="pageHeader">
    <div class="header-gr" id="headerGreet"></div>
    <div class="header-nm" id="headerName"></div>
  </div>

  <!-- 통독 / 출석 탭 -->
  <div class="home-tabs">
    <button class="h-tab active" id="tabTongdokBtn" onclick="switchTab('tongdok')">📖 통독</button>
    <button class="h-tab" id="tabAttBtn" onclick="switchTab('att')">✅ 출석</button>
  </div>

  <!-- 통독 탭 -->
  <div id="tabTongdok">
    <div class="tue-banner" id="tueBanner" style="display:none">
      <div>
        <div class="bt">이번 주 통독 체크하기</div>
        <div class="bs">오늘 자정(24:00)까지</div>
      </div>
      <button class="check-btn" id="checkBtn" onclick="openSheet(currentCheckWeek)">체크</button>
    </div>

    <div class="lock-notice" id="lockNotice" style="display:none">
      <div class="lt" id="lockTitle">체크는 정해진 요일에만 가능해요</div>
      <div class="ls" id="nextCheckLabel"></div>
    </div>

    <div class="child-card" id="childCard">
      <div class="child-row">
        <div>
          <div class="child-name" id="childName"></div>
          <div class="child-grade" id="childGrade"></div>
          <div class="child-deadline" id="childDeadline" style="display:none">마감: 오늘 자정까지</div>
        </div>
      </div>
      <div class="pr-lbl">
        <span>이번 학기 통독</span>
        <span class="pr-cnt" id="progressLabel">0 / 0주 완료</span>
      </div>
      <div class="pr-bg"><div class="pr-fill" id="progressBar" style="width:0%"></div></div>
    </div>

    <div class="sec">
      <div class="sec-t">통독주차</div>
      <div class="sec-hint" id="stampHint" style="display:none"></div>
      <div class="stamp-grid" id="stampGrid"></div>
    </div>

    <div class="sec" style="padding-top:0">
      <div class="sec-t">최근 통독 내역</div>
      <div id="histList"></div>
    </div>
  </div>

  <!-- 출석 탭 -->
  <div id="tabAtt" style="display:none">
    <div class="att-card">
      <div class="child-row">
        <div>
          <div class="child-name" id="attChildName"></div>
          <div class="child-grade" id="attChildGrade"></div>
        </div>
      </div>
      <div class="pr-lbl">
        <span>이번 학기 출석률</span>
        <span class="pr-cnt" id="attRateLabel">—</span>
      </div>
      <div class="pr-bg"><div class="pr-fill" id="attRateBar" style="width:0%;background:linear-gradient(90deg,var(--green),#52DDA0)"></div></div>
    </div>
    <div class="sec" style="padding-top:8px">
      <div class="sec-t">최근 출석 현황</div>
      <div id="attHistList"></div>
    </div>
  </div>

  <button class="logout-btn" onclick="logout()">로그아웃</button>
  <div style="height:20px"></div>
</div>

<div class="overlay" id="checkOverlay" onclick="hideSheet(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-t" id="sheetTitle"></div>
    <div class="sheet-sub" id="sheetSub"></div>
    <div class="check-opt complete" onclick="submitCheck('done')">
      <div class="check-opt-ic ic-done"></div>
      <div>
        <div class="check-opt-lbl">완료했어요!</div>
        <div class="check-opt-desc">이번 주 성경통독을 모두 마쳤어요</div>
      </div>
    </div>
    <div class="check-opt partial-opt" onclick="submitCheck('partial')">
      <div class="check-opt-ic ic-partial"></div>
      <div>
        <div class="check-opt-lbl">부분완료</div>
        <div class="check-opt-desc">일부만 읽었어요</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
  <script src="js/pwa.js" defer></script>
<script>
  let student = null, semester = null, weekRecords = {}, attRecords = {}, checkingWeek = null, currentCheckWeek = 0;

  // 공통 유틸은 js/config.js 참조 (CHECK_DAY 한 곳에서 요일 관리)
  const isTuesdayKST   = isCheckDayKST;
  const nextTuesdayLabel = nextCheckDayLabel;
  const calcCurrentWeek  = calcWeekNum;
  const getCheckDate     = weekCheckDateObj;
  const fmtDate          = fmtShortDate;

  const specialWeekLabel = w => (semester ? weekTypeLabel(semester, w) : '') || '';

  function weekRange(sem, w) {
    const tue = getCheckDate(sem, w);
    const wed = new Date(tue); wed.setUTCDate(tue.getUTCDate() - 6);
    const mon = new Date(tue); mon.setUTCDate(tue.getUTCDate() - 1);
    return `${fmtDate(wed)} ~ ${fmtDate(mon)}`;
  }

  async function init() {
    const studentId = localStorage.getItem('studentId');
    if (!studentId) { window.location.href = '/'; return; }

    try {
      // 학생 정보
      // 민감 컬럼(pin/phone/birthday)은 조회하지 않습니다 — supabase/fix_security.sql 참고
      const { data: st, error: stErr } = await sb.from('joyland_students')
        .select('id, name, grade, class_name, active').eq('id', studentId).single();
      if (stErr || !st || !st.active) { localStorage.clear(); window.location.href = '/'; return; }
      student = st;

      // 활성 학기
      const { data: sems } = await sb.from('joyland_semesters').select('*').eq('active', true).limit(1);
      semester = sems?.[0] || null;

      if (semester) {
        // 이번 학기 통독 기록
        const { data: recs } = await sb.from('joyland_records')
          .select('week_num, status')
          .eq('student_id', studentId)
          .eq('semester_id', semester.id);
        (recs || []).forEach(r => { weekRecords[r.week_num] = r.status; });

        // 이번 학기 출석 기록
        const { data: attData } = await sb.from('joyland_attendance')
          .select('week_num, status')
          .eq('student_id', studentId)
          .eq('semester_id', semester.id);
        (attData || []).forEach(r => { attRecords[r.week_num] = r.status; });
      }

      renderPage();
    } catch (e) {
      console.error(e);
      alert('데이터를 불러오는 중 오류가 발생했습니다.');
    } finally {
      document.getElementById('loadingScreen').classList.add('hidden');
      document.getElementById('mainPage').style.display = 'block';
    }
  }

  function renderPage() {
    const isTue = isTuesdayKST();
    const totalWeeks = semester?.total_weeks || 0;
    const checkedCount = Object.keys(weekRecords).length;
    const currentWeek = semester ? calcCurrentWeek(semester) : 0;

    // 상태 초기화 (재호출 시 중복 방지)
    document.getElementById('tueBanner').style.display = 'none';
    document.getElementById('lockNotice').style.display = 'none';
    document.getElementById('childDeadline').style.display = 'none';
    document.getElementById('stampHint').style.display = 'none';

    // 헤더
    document.getElementById('headerGreet').textContent = isTue ? `오늘은 ${CHECK_DAY_LABEL}요일이에요` : '안녕하세요';
    document.getElementById('lockTitle').textContent = `체크는 ${CHECK_DAY_LABEL}요일에만 가능해요`;
    document.getElementById('headerName').innerHTML = `${student.name} <span>부모님</span>`;

    // 화요일 배너 / 잠금
    currentCheckWeek = currentWeek;
    const specialSet = specialWeekSet(semester);   // 시상 제외 (테스트 포함)
    const noCheckSet = noCheckWeekSet(semester);   // 체크 자체 불가
    const isNoCheckNow = noCheckSet.has(currentWeek);
    const isTestNow = weekTypeLabel(semester, currentWeek) === '테스트';
    const inSemester = currentWeek >= 1 && currentWeek <= totalWeeks;
    const showsBanner = isTue && inSemester && !isNoCheckNow;
    if (showsBanner) {
      const alreadyChecked = !!weekRecords[currentWeek];
      document.getElementById('tueBanner').style.display = 'flex';
      document.getElementById('childDeadline').style.display = 'block';
      document.querySelector('#tueBanner .bt').textContent = isTestNow
        ? '연습해보기 (테스트 주간)'
        : (alreadyChecked ? '이번 주 통독 수정하기' : '이번 주 통독 체크하기');
      document.querySelector('#tueBanner .bs').textContent = isTestNow
        ? '자유롭게 눌러보세요 · 시상에는 반영되지 않아요'
        : (alreadyChecked
            ? `${weekRecords[currentWeek] === 'done' ? '완료' : '부분완료'}로 기록됨 · 수정 가능`
            : '오늘 자정(24:00)까지');
      document.getElementById('checkBtn').textContent = alreadyChecked ? '수정' : '체크';
    } else if (isNoCheckNow && inSemester) {
      // 방학·개강·종강 주간 안내
      const lock = document.getElementById('lockNotice');
      lock.style.display = 'flex';
      document.getElementById('lockTitle').textContent = `이번 주는 ${specialWeekLabel(currentWeek)} 주간이에요`;
      document.getElementById('nextCheckLabel').textContent = '통독 체크는 쉬어갑니다';
    } else if (!isTue) {
      document.getElementById('lockNotice').style.display = 'flex';
      document.getElementById('nextCheckLabel').textContent = nextTuesdayLabel();
    }

    // 자녀 카드 (방학·개강·종강 주차는 진행률에서 제외)
    const targetWeeks = Math.max(totalWeeks - specialSet.size, 0);
    document.getElementById('childName').textContent = student.name;
    document.getElementById('childGrade').textContent =
      semester ? `${student.grade} · ${semester.year}년 ${semester.semester}학기` : student.grade;
    document.getElementById('progressLabel').textContent = `${checkedCount} / ${targetWeeks}주 완료`;
    document.getElementById('progressBar').style.width = targetWeeks > 0 ? `${(checkedCount/targetWeeks)*100}%` : '0%';

    // 도장판
    if (showsBanner && !weekRecords[currentWeek]) {
      const hint = document.getElementById('stampHint');
      hint.textContent = `${currentWeek}주차 도장을 눌러 체크하세요`;
      hint.style.display = 'block';
    }
    renderStamps(totalWeeks, isTue, currentWeek);
    renderHistory(totalWeeks, currentWeek);
  }

  function renderStamps(totalWeeks, isTue, currentWeek) {
    const grid = document.getElementById('stampGrid');
    grid.innerHTML = '';
    const now = new Date();
    const noCheckSet = noCheckWeekSet(semester);
    for (let w = 1; w <= totalWeeks; w++) {
      const div = document.createElement('div');
      div.className = 'stamp';
      const status = weekRecords[w];
      const checkDate = semester ? getCheckDate(semester, w) : null;
      // 날짜 (8/25 형식) — 모든 도장에 함께 표시
      const dateStr = checkDate ? `${checkDate.getUTCMonth()+1}/${checkDate.getUTCDate()}` : '';
      const tag = semester ? weekTypeLabel(semester, w) : null;
      const body = (extraTag) =>
        `<div class="stamp-wk">${w}주</div>` +
        (dateStr ? `<div class="stamp-dt">${dateStr}</div>` : '') +
        (extraTag ? `<div class="stamp-tag">${extraTag}</div>` : '');

      // 방학·개강·종강 주차는 통독 체크 대상이 아님
      if (noCheckSet.has(w)) {
        div.classList.add('special');
        div.title = `${tag} 주간 · 통독 체크 없음`;
        div.innerHTML = body(tag);
        grid.appendChild(div);
        continue;
      }

      // 테스트 주차 — 체크는 가능, 시상에는 미반영
      const isTest = tag === '테스트';
      if (isTest) div.classList.add('test');

      if (status) {
        div.classList.add(status);
        div.innerHTML = body(isTest ? '테스트' : null);
        if (isTue && w === currentWeek) {
          div.style.cursor = 'pointer';
          div.title = '탭해서 수정';
          div.onclick = () => openSheet(w);
        }
      } else if (w === currentWeek && isTue) {
        div.classList.add('open');
        div.innerHTML = body(isTest ? '테스트' : null);
        div.onclick = () => openSheet(w);
      } else if (w === currentWeek && !isTue) {
        div.classList.add('locked');
        div.innerHTML = body(isTest ? '테스트' : null);
      } else if (checkDate && checkDate < now && w < currentWeek) {
        div.classList.add('missed');
        div.innerHTML = body(isTest ? '테스트' : null);
      } else {
        div.classList.add('future');
        div.innerHTML = body(isTest ? '테스트' : null);
      }
      grid.appendChild(div);
    }
  }

  function renderHistory(totalWeeks, currentWeek) {
    const list = document.getElementById('histList');
    list.innerHTML = '';
    const weeks = [];
    for (let w = Math.min(currentWeek, totalWeeks); w >= 1 && weeks.length < 5; w--) weeks.push(w);
    if (!weeks.length) {
      list.innerHTML = '<div style="text-align:center;color:#8B87A0;font-size:13px;padding:16px 0">아직 체크 내역이 없어요</div>';
      return;
    }
    weeks.forEach(w => {
      const status = weekRecords[w];
      const range = semester ? weekRange(semester, w) : '';
      const checkDate = semester ? fmtDate(getCheckDate(semester, w)) : '';
      let statusHtml = '미체크', statusClass = 'missed';
      const wLabel = semester ? weekTypeLabel(semester, w) : null;
      if (noCheckWeekSet(semester).has(w)) { statusHtml = wLabel; statusClass = 'missed'; }
      else if (status === 'done') { statusHtml = wLabel === '테스트' ? '완료 (테스트)' : '완료'; statusClass = 'done'; }
      else if (status === 'partial') { statusHtml = wLabel === '테스트' ? '부분완료 (테스트)' : '부분완료'; statusClass = 'partial'; }
      else if (wLabel === '테스트') { statusHtml = '테스트'; statusClass = 'missed'; }
      const div = document.createElement('div');
      div.className = 'hist-item';
      div.innerHTML = `
        <div class="hist-inf">
          <div class="hist-wk">${w}주차 · ${range}</div>
          <div class="hist-dt">${checkDate} 체크일</div>
        </div>
        <div class="hist-st ${statusClass}">${statusHtml}</div>
      `;
      list.appendChild(div);
    });
  }

  function openSheet(weekNum) {
    // 방학·개강·종강 주차는 체크 대상이 아님 (UI 우회 방지)
    if (noCheckWeekSet(semester).has(weekNum)) {
      showToast(`${specialWeekLabel(weekNum)} 주간은 통독 체크를 하지 않아요`);
      return;
    }
    if (!isTuesdayKST()) { showToast(`통독 체크는 ${CHECK_DAY_LABEL}요일에만 가능해요`); return; }
    checkingWeek = weekNum;
    const isEdit = !!weekRecords[weekNum];
    document.getElementById('sheetTitle').textContent = `${weekNum}주차 통독 ${isEdit ? '수정' : '체크'}`;
    document.getElementById('sheetSub').textContent = isEdit
      ? `현재: ${weekRecords[weekNum] === 'done' ? '완료' : '부분완료'} · 변경할 항목을 선택해주세요`
      : (semester ? weekRange(semester, weekNum) : '');
    document.getElementById('checkOverlay').classList.add('show');
  }

  function hideSheet(e) {
    if (e.target === document.getElementById('checkOverlay'))
      document.getElementById('checkOverlay').classList.remove('show');
  }

  async function submitCheck(status) {
    document.getElementById('checkOverlay').classList.remove('show');
    const w = checkingWeek;
    try {
      const { error } = await sb.from('joyland_records').upsert({
        student_id: student.id,
        semester_id: semester.id,
        week_num: w,
        status: status
      }, { onConflict: 'student_id,semester_id,week_num' });
      if (error) throw error;

      weekRecords[w] = status;
      const totalWeeks = semester.total_weeks;
      const checkedCount = Object.keys(weekRecords).length;
      const currentWeek = calcCurrentWeek(semester);

      document.getElementById('progressLabel').textContent = `${checkedCount} / ${totalWeeks}주 완료`;
      document.getElementById('progressBar').style.width = `${(checkedCount/totalWeeks)*100}%`;
      renderStamps(totalWeeks, isTuesdayKST(), currentWeek);
      renderHistory(totalWeeks, currentWeek);
      document.getElementById('stampHint').style.display = 'none';
      renderPage();
      showToast(status === 'done' ? '완료로 기록했어요!' : '부분완료로 기록했어요!');
    } catch (e) {
      console.error(e);
      alert('저장 중 오류가 발생했습니다. 다시 시도해주세요.');
    }
  }

  function switchTab(tab) {
    const isTongdok = tab === 'tongdok';
    document.getElementById('tabTongdok').style.display = isTongdok ? 'block' : 'none';
    document.getElementById('tabAtt').style.display = isTongdok ? 'none' : 'block';
    document.getElementById('tabTongdokBtn').classList.toggle('active', isTongdok);
    document.getElementById('tabAttBtn').classList.toggle('active', !isTongdok);
    if (!isTongdok) renderAttendance();
  }

  function renderAttendance() {
    const totalWeeks = semester?.total_weeks || 0;
    const currentWeek = semester ? calcCurrentWeek(semester) : 0;
    const attCount = Object.values(attRecords).filter(s => s === '출석' || s === '지각').length;
    const totalChecked = Object.keys(attRecords).length;

    document.getElementById('attChildName').textContent = student.name;
    document.getElementById('attChildGrade').textContent =
      semester ? `${student.grade} · ${semester.year}년 ${semester.semester}학기` : student.grade;

    const rate = totalChecked > 0 ? Math.round((attCount / totalChecked) * 100) : null;
    document.getElementById('attRateLabel').textContent = rate !== null ? `${rate}% 출석` : '아직 기록 없음';
    document.getElementById('attRateBar').style.width = rate !== null ? `${rate}%` : '0%';

    const list = document.getElementById('attHistList');
    list.innerHTML = '';
    const weeks = [];
    for (let w = Math.min(currentWeek, totalWeeks); w >= 1 && weeks.length < 8; w--) weeks.push(w);
    if (!weeks.length) {
      list.innerHTML = '<div style="text-align:center;color:#8B87A0;font-size:13px;padding:16px 0">아직 출석 기록이 없어요</div>';
      return;
    }
    weeks.forEach(w => {
      const status = attRecords[w];
      const checkDate = semester ? fmtDate(getCheckDate(semester, w)) : '';
      const isCurrentWeek = w === currentWeek;
      let badgeClass = 'att-none', badgeText = '미처리';
      if (status === '출석') { badgeClass = 'att-ok'; badgeText = '출석'; }
      else if (status === '지각') { badgeClass = 'att-late'; badgeText = '지각'; }
      else if (status === '결석') { badgeClass = 'att-absent'; badgeText = '결석'; }
      const div = document.createElement('div');
      div.className = 'att-row';
      div.innerHTML = `
        <div class="att-row-inf">
          <div class="att-wk">${w}주차 · ${checkDate}</div>
          ${isCurrentWeek ? '<div class="att-dt">이번 주</div>' : ''}
        </div>
        <span class="att-badge ${badgeClass}">${badgeText}</span>
      `;
      list.appendChild(div);
    });
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function logout() { localStorage.clear(); window.location.href = '/'; }

  init();
</script>
</body>
</html>
